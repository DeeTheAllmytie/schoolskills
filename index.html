        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Roboto Condensed', sans-serif; background-color: #8f70d1; }

            display: flex; /* Enable Flexbox for the nav container */
            justify-content: space-between; /* Puts space between the two main divs */

            padding-top: 10px;
            padding-bottom: 10px;
            background-color: royalblue;
            height: 60px; /* Set a fixed height for consistency */
            text-align: right;
            padding: 0px;
            position: fixed; /* Keeps it at the top of the viewport */
            width: 100%;

        <button onclick="javascript:(function(){var row=document.querySelector('.timetable-small');if(!row)return;var periodMap={};var currentDayIndex=-1;row.querySelectorAll('table tr').forEach(tr=>{var th=tr.querySelector('th');var subjectEl=tr.querySelector('td .timetable-subject');if(th&&subjectEl){var fullTimeText=th.innerText||'';var metaText=tr.querySelector('time.meta')?.innerText||%27%27;var periodName=fullTimeText.replace(metaText,%27%27).trim();var className=subjectEl.querySelector(%27a%27)?.innerText.trim()||%27%27;var extraDiv=subjectEl.querySelector(%27div%27);var extraText=extraDiv?extraDiv.innerText.replace(className,%27%27).trim():%27%27;var bg=subjectEl.style.backgroundColor||%27%27;if(periodName.toLowerCase().includes(%27period 0%27)){currentDayIndex++;}if(!periodMap[periodName]){periodMap[periodName]={time:metaText.trim(),slots:[]};}while(periodMap[periodName].slots.length<currentDayIndex){periodMap[periodName].slots.push({className:%27%27,details:%27%27,bg:%27%27});}periodMap[periodName].slots[currentDayIndex]={className:className,details:extraText,bg:bg};}});var cleanData=[];for(var pName in periodMap){if(periodMap.hasOwnProperty(pName)){var slotsArray=[];for(var i=0;i<=currentDayIndex;i++){slotsArray.push(periodMap[pName].slots[i]||{className:%27%27,details:%27%27,bg:%27%27});}cleanData.push({period:pName,time:periodMap[pName].time,slots:slotsArray});}}var rawStr=JSON.stringify(cleanData);var encStr=btoa(unescape(encodeURIComponent(rawStr)));var blob=new Blob([JSON.stringify({secureData:encStr},null,2)],{type:%27application/json%27});var a=document.createElement(%27a%27);a.href=URL.createObjectURL(blob);a.download=%27grid_timetable.json%27;document.body.appendChild(a);a.click();document.body.removeChild(a);})();">Download Timetable</button>
        <!-- Upload UI Component Elements -->
<div style="margin: 10px 0; display: inline-block;">
    <input type="file" id="timetableUpload" accept=".json" style="display: none;">
    <button onclick="document.getElementById('timetableUpload').click()" style="background-color: #4CAF50; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
        Upload JSON Timetable
    </button>
</div>

<script>
document.getElementById('timetableUpload').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const rawData = JSON.parse(e.target.result);
            if (!rawData.secureData) {
                alert("Invalid format: 'secureData' not found.");
                return;
            }

            // Decode Base64 and parse payload array
            const decodedString = atob(rawData.secureData);
            const timetableData = JSON.parse(decodedString);

            populateTimetable(timetableData);
        } catch (error) {
            console.error(error);
            alert("Error parsing JSON file.");
        }
    };
    reader.readAsText(file);
});

// Fixed cleanTimeFormat function without the breaking code typo
function cleanTimeFormat(timeStr) {
    if (!timeStr) return "";

    // Safely scans for the digits block patterns, avoiding code crash errors
    const timeMatch = timeStr.match(/(\d{1,2}:\d{2}\s*[ap]m).*?(\d{1,2}:\d{2}\s*[ap]m)/i);
    
    if (timeMatch && timeMatch.length >= 3) {
        return `${timeMatch[1].toLowerCase()} - ${timeMatch[2].toLowerCase()}`;
    }

    // Direct string character replacement fallback
    let cleanStr = timeStr.replace(/Ã¢Â€Â“|â€“|—|–|&ndash;|&mdash;/g, " - ");
    return cleanStr.replace(/\s*-\s*/, " - ").trim();
}

function populateTimetable(data) {
    const table = document.querySelector('table') || document.querySelector('.grid-container'); 
    if (!table) {
        alert("Timetable grid container table not found.");
        return;
    }

    data.forEach((row) => {
        const periodName = row.period;
        const periodTime = cleanTimeFormat(row.time);   
        const slots = row.slots;       

        let targetRow = null;
        const rows = table.querySelectorAll('tr');

        // Identify matching row blocks
        rows.forEach(r => {
            const firstCell = r.querySelector('td:first-child, th:first-child');
            if (firstCell) {
                const text = firstCell.textContent.toLowerCase();
                if (
                    (periodName.toLowerCase().includes('1') && text.includes('p1')) ||
                    (periodName.toLowerCase().includes('2') && text.includes('p2')) ||
                    (periodName.toLowerCase().includes('3') && text.includes('p3')) ||
                    (periodName.toLowerCase().includes('4') && text.includes('p4')) ||
                    (periodName.toLowerCase().includes('5') && text.includes('p5')) ||
                    (periodName.toLowerCase().includes('6') && text.includes('p6')) ||
                    (periodName.toLowerCase().includes('7') && text.includes('p7')) ||
                    text.includes(periodName.toLowerCase())
                ) {
                    targetRow = r;
                }
            }
        });

        if (targetRow) {
            // Target first column containing the P1 / P2 period title blocks
            const firstCell = targetRow.querySelector('td:first-child, th:first-child');
            if (firstCell) {
                const match = firstCell.textContent.match(/P\d+/i) || [periodName];
                const cleanPeriodLabel = match[0].toUpperCase();

                // Rewrite cell contents applying sanitized and clean timestamp formatting
                firstCell.innerHTML = `
                    <div style="font-weight: bold; font-size: 14px; margin-bottom: 2px;">${cleanPeriodLabel}</div>
                    <div style="font-size: 11px; color: #555; font-weight: normal; line-height: 1.2; white-space: nowrap;">${periodTime}</div>
                `;
            }

            // Target remaining block slots across columns (Day 1 through Day 10)
            const cells = targetRow.querySelectorAll('td:not(:first-child)');
            slots.forEach((slot, index) => {
                if (cells[index]) {
                    if (slot.className) {
                        cells[index].style.backgroundColor = slot.bg || '#ffffff';
                        cells[index].style.padding = '8px';
                        cells[index].style.fontSize = '12px';
                        cells[index].style.verticalAlign = 'middle';
                        
                        cells[index].innerHTML = `<strong>${slot.className}</strong>`;
                    } else {
                        cells[index].textContent = '-';
                        cells[index].style.backgroundColor = '';
                    }
                }
            });
        }
    });
}
</script>

        <span id="saveStatus" style="color: green; font-size: 0.8em;"></span>
    </div>
    <h1>My Timetable</h1>
    <table id="timetable">
        <thead><tr id="dayHeaders"><th class="period-col">Period</th></tr></thead>
        <tbody id="timetableBody"></tbody>
    </table>
</div>

<script>
    const subjects = ["Religion", "History", "Science", "English", "Maths", "Language: Italian", "Language: Japanese", "Language: Chinese", "Music", "Digital Technologies", "Personal Social Learning", "Junior Enhancement Mathematics", "Junior Enhancement English", "Junior Enhancement Science", "Junior Enhancement History", "Sport", "Physical Education", "Art", "Homework Club", "Instrumental Music", "Design and Technologies", "Design and Materials", "Pastoral"];
    const days = ["Day 1", "Day 2", "Day 3", "Day 4", "Day 5", "Day 6", "Day 7", "Day 8", "Day 9", "Day 10"];

    function init() {
        const header = document.getElementById('dayHeaders');
        const body = document.getElementById('timetableBody');
        days.forEach(d => { let th = document.createElement('th'); th.innerText = d; header.appendChild(th); });

        for (let p = 1; p <= 6; p++) {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td class="period-col">P${p}<br><input type="text" class="time-input" placeholder="0:00"><span class="time-display-print" style="display:none"></span></td>`;
            for (let d = 0; d < 10; d++) {
                let td = document.createElement('td');
                let sel = document.createElement('select');
                sel.className = "subject-select";
                sel.innerHTML = `<option value="">--</option>` + subjects.map(s => `<option value="${s}">${s}</option>`).join('');
                sel.onchange = function() { adjustFont(this); save(); };
                td.appendChild(sel);
                tr.appendChild(td);
            }
            body.appendChild(tr);
        }
        load();
    }

    function adjustFont(el) {
        // Dynamic scaling based on character count
        const len = el.value.length;
        if (len > 25) el.style.fontSize = "0.45rem";
        else if (len > 15) el.style.fontSize = "0.55rem";
        else el.style.fontSize = "0.7rem";
    }

    function save() {
        const data = {
            times: Array.from(document.querySelectorAll('.time-input')).map(i => i.value),
            subjects: Array.from(document.querySelectorAll('.subject-select')).map(s => s.value)
        };
        localStorage.setItem('maz_data', JSON.stringify(data));
        document.getElementById('saveStatus').innerText = "Saved!";
    }

    function load() {
        const data = JSON.parse(localStorage.getItem('maz_data'));
        if (!data) return;
        document.querySelectorAll('.time-input').forEach((i, idx) => i.value = data.times[idx] || "");
        document.querySelectorAll('.subject-select').forEach((s, idx) => {
            s.value = data.subjects[idx] || "";
            adjustFont(s);
        });
    }

    function handlePrint() {
        document.querySelectorAll('.time-input').forEach(i => i.nextElementSibling.innerText = i.value);
        window.print();
    }

    window.onload = init;
</script>
</body>
