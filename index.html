<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Generator</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav>
        <div class="nav-links">
            <a href="#" class="pagelink">Timetable Generator</a>
            <a href="#" class="pagelink">(NEW) Flashcard Generator</a>
        </div>
        <div class="info-section">
            <a href="#" class="setting">Settings</a>
        </div>
    </nav>

    <!-- Main App Content -->
    <div class="mainContent">
        <header>
            <h1>Timetable Generator</h1>
            <p class="tagline">Organise, import, and print your weekly academic schedule cleanly.</p>
        </header>

        <section class="introduction">
            <!-- Action Options Panel -->
            <div class="options">
                <!-- Existing action button -->
                <a href="#" class="button" onclick="window.print(); return false;">Print / Save as PDF</a>
                
                <!-- NEW Integrated Upload Button Style Trigger -->
                <label for="timetable-upload-input" class="button upload-btn-label">
                    <svg xmlns="http://w3.org" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" style="margin-right: 6px; vertical-align: middle;">
                        <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                        <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/>
                    </svg>
                    Upload Timetable JSON
                </label>
                <input type="file" id="timetable-upload-input" accept=".json" style="display: none;" />
            </div>
        </section>

        <!-- Timetable Target Frame Area -->
        <fieldset class="timetable-card-frame">
            <legend><h2># My Timetable</h2></legend>
            <div id="timetable-grid-output">
                <p class="placeholder-text">No active data loaded. Click "Upload Timetable JSON" above to parse your exported grid schedule.</p>
            </div>
        </fieldset>
    </div>

    <!-- Extraction JavaScript Decryption Engine Core Layer -->
    <script>
        document.getElementById('timetable-upload-input').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    // 1. Process base structural file wrapper
                    const outerPayload = JSON.parse(e.target.result);
                    if (!outerPayload.secureData) {
                        alert("Invalid layout template: Missing embedded sequence.");
                        return;
                    }

                    // 2. Safely decode the Base64 sequence matching your bookmarklet parameters
                    const rawDecodedStr = decodeURIComponent(escape(atob(outerPayload.secureData)));
                    const parsedDataGrid = JSON.parse(rawDecodedStr);

                    // 3. Dispatch to structural element builder
                    renderImportedGridTable(parsedDataGrid);
                } catch (err) {
                    console.error("Layout reading error:", err);
                    alert("Failure parsing your file. Generate a fresh backup with the script tool.");
                }
            };
            reader.readAsText(file);
        });

        function renderImportedGridTable(dataset) {
            const targetContainer = document.getElementById('timetable-grid-output');
            targetContainer.innerHTML = ''; // Wipe prior placeholders or obsolete tables

            if (!dataset || dataset.length === 0) {
                targetContainer.innerHTML = '<p class="placeholder-text">The imported configuration data grid is empty.</p>';
                return;
            }

            const nativeTable = document.createElement('table');
            nativeTable.className = 'imported-timetable-table';

            dataset.forEach(periodRow => {
                const tr = document.createElement('tr');
                
                // Construct the dynamic row text header cell (Period title & Time segment)
                const th = document.createElement('th');
                th.innerHTML = `<div class="period-name">${periodRow.period}</div><div class="period-time">${periodRow.time}</div>`;
                tr.appendChild(th);

                // Construct columns for corresponding slots
                periodRow.slots.forEach(slotItem => {
                    const td = document.createElement('td');
                    if (slotItem.bg) {
                        td.style.backgroundColor = slotItem.bg;
                    }

                    if (slotItem.className) {
                        td.innerHTML = `<div class="cell-class-name">${slotItem.className}</div><div class="cell-class-details">${slotItem.details || ''}</div>`;
                    } else {
                        td.innerHTML = `<span class="empty-slot-marker">—</span>`;
                    }
                    tr.appendChild(td);
                });

                nativeTable.appendChild(tr);
            });

            targetContainer.appendChild(nativeTable);
        }
    </script>
</body>
</html>
