    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Roboto Condensed', sans-serif; background-color: #8f70d1; }
        .container { display: flex; flex-direction: column; height: 100vh; width: 100vw; background: white; padding: 10px; box-sizing: border-box; }
        h1 { color: #003366; text-align: center; border-bottom: 2px solid black; margin: 0 0 5px 0; font-size: 1.2em; }
        .controls { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .print-btn { background: steelblue; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        table { width: 100%; flex-grow: 1; border-collapse: collapse; border: 2px solid black; table-layout: fixed; }
        th, td { border: 1px solid black; text-align: center; vertical-align: middle; padding: 2px; overflow: hidden; word-wrap: break-word; line-height: 1.1; }
        
        th { background-color: royalblue; color: white; font-size: 0.6rem; height: 35px; }
        .period-col { background-color: #f8f9fa; font-weight: bold; width: 55px; font-size: 0.65rem; }
        .time-input { width: 90%; font-size: 0.65rem; border: 1px solid #ccc; text-align: center; }

        /* The Subject Text Styling */
        select.subject-select { 
            width: 100%; height: 100%; border: none; background: transparent; 
            text-align: center; font-family: 'Roboto Condensed', sans-serif;
            font-size: 0.7rem; appearance: none; cursor: pointer;
            display: block; white-space: normal; /* Allows text to wrap to 2nd line */
        }
        .nav-links {
            flex-grow: 1; /* Allows this div to take up available space */
            text-align: center; /* Centers the links within this div */
        }

        nav {
            display: flex; /* Enable Flexbox for the nav container */
            justify-content: space-between; /* Puts space between the two main divs */
            align-items: center; /* Vertically aligns items in the middle */
            padding: 0 15px; /* Add some horizontal padding to the nav bar */
            padding-top: 10px;
            padding-bottom: 10px;
            background-color: royalblue;
            height: 60px; /* Set a fixed height for consistency */
            text-align: right;
            padding: 0px;
            position: fixed; /* Keeps it at the top of the viewport */
            width: 100%;
            top: 0; /* Make sure it's explicitly at the very top */
            left: 0; /* Make sure it's explicitly at the very left */
            border-bottom: 3px solid black;
            z-index: 1000; /* Optional: Ensures it stays on top of other content */
        }

        .pagelink {
            background-color: rgba(223, 220, 227, 0);
            color: white;
            text-decoration: none;
            padding: 1.2% 15px; /* Added some horizontal padding for better spacing */
            display: inline-block;
        }

        .pagelink:hover {
            background-color: rgba(223,220,227,0.5);
            border-bottom: 5px solid black;
        }

        @media print {
            @page { size: A5 landscape; margin: 0.2cm; }
            .controls, .time-input { display: none !important; }
            .time-display-print { display: block !important; font-size: 0.65rem; }
            table { height: 90%; }
            select.subject-select { font-weight: bold; color: black; text-transform: uppercase; font-size: 0.55rem; }
            th { background-color: #eee !important; color: black !important; }
        }
    </style>

<body>
<div class="container">
    <div class="controls">
        <nav>
            <div class="nav-links">
                <a href="index.html" class="pagelink"><i class="fa-solid fa-calendar-days"></i> Timetable Generator</a>
            </div>
            <div class="nav-links">
                <a href="cueGenerator.html" class="pagelink"><i class="fa-solid fa-book"></i></i> (NEW) Flashcard Generator</a>

    <div class="controls">   
        <button class="print-btn" onclick="handlePrint()">Print / Save as PDF</button>
        <!-- Place this next to your "Print / Save as PDF" button -->
<div style="margin: 10px 0; display: inline-block;">
    <input type="file" id="timetableUpload" accept=".json" style="display: none;">
    <button onclick="document.getElementById('timetableUpload').click()" style="background-color: #4CAF50; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
        Upload JSON Timetable
    </button>
</div>

<script>
document.getElementById('timetableUpload').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const rawData = JSON.parse(e.target.result);
            
            // Your bookmark exports data inside a Base64-encoded "secureData" string
            if (!rawData.secureData) {
                alert("Invalid file format: 'secureData' field missing.");
                return;
            }

            // Decode Base64 and parse the underlying timetable array
            const decodedString = atob(rawData.secureData);
            const timetableData = JSON.parse(decodedString);

            populateTimetable(timetableData);
        } catch (error) {
            console.error(error);
            alert("Error parsing JSON file. Make sure it's the correct file from your bookmark.");
        }
    };
    reader.readAsText(file);
});

function populateTimetable(data) {
    // Find your timetable grid/table element container
    // Adjust this selector if your actual table has a specific ID or class
    const table = document.querySelector('table') || document.querySelector('.grid-container'); 
    if (!table) {
        alert("Timetable container element not found on page.");
        return;
    }

    // Process each period row coming from your JSON data
    data.forEach((row) => {
        const periodName = row.period; // e.g., "Period 1", "Pastoral"
        const periodTime = row.time;   // e.g., "8:50am–9:40am"
        const slots = row.slots;       // Array of 10 slots representing Day 1 to Day 10

        // Find the matching row in your HTML table structure.
        // We match rows based on text hints like "P1", "P2", "P3", or the explicit index.
        let targetRow = null;
        const rows = table.querySelectorAll('tr');

        rows.forEach(r => {
            const firstCell = r.querySelector('td:first-child, th:first-child');
            if (firstCell) {
                const text = firstCell.textContent.toLowerCase();
                
                // Normalizes matching (e.g., matching JSON "Period 1" to HTML cell displaying "P1")
                if (
                    (periodName.toLowerCase().includes('1') && text.includes('p1')) ||
                    (periodName.toLowerCase().includes('2') && text.includes('p2')) ||
                    (periodName.toLowerCase().includes('3') && text.includes('p3')) ||
                    (periodName.toLowerCase().includes('4') && text.includes('p4')) ||
                    (periodName.toLowerCase().includes('5') && text.includes('p5')) ||
                    (periodName.toLowerCase().includes('6') && text.includes('p6')) ||
                    (periodName.toLowerCase().includes('7') && text.includes('p7')) ||
                    text.includes(periodName.toLowerCase())
                ) {
                    targetRow = r;
                }
            }
        });

        // If a row matches, populate the sub-time label and columns
        if (targetRow) {
            // Update time label inside the first cell if applicable
            const timeLabel = targetRow.querySelector('td:first-child div, td:first-child small');
            if (timeLabel) {
                timeLabel.textContent = periodTime;
            } else {
                // Alternately look for explicit line breaks or text replacement targets
                const firstCell = targetRow.querySelector('td:first-child');
                if (firstCell && firstCell.innerHTML.includes('<br>')) {
                    const parts = firstCell.innerHTML.split('<br>');
                    firstCell.innerHTML = `${parts[0]}<br><span style="font-size:11px; opacity:0.7;">${periodTime}</span>`;
                }
            }

            // Fill columns (Day 1 through Day 10 elements)
            const cells = targetRow.querySelectorAll('td:not(:first-child)');
            slots.forEach((slot, index) => {
                if (cells[index]) {
                    if (slot.className) {
                        // Apply styling and content from JSON
                        cells[index].style.backgroundColor = slot.bg || '#ffffff';
                        cells[index].style.padding = '8px';
                        cells[index].style.fontSize = '12px';
                        
                        // Replace line breaks from details string gracefully
                        const detailedText = slot.details ? slot.details.replace(/\n/g, '<br>') : '';
                        cells[index].innerHTML = `<strong>${slot.className}</strong><br><span style="font-size:10px; color:#555;">${detailedText}</span>`;
                    } else {
                        // Keep slot blank/hyphenated if data is empty
                        cells[index].textContent = '-';
                        cells[index].style.backgroundColor = '';
                    }
                }
            });
        }
    });
}
</script>

        <span id="saveStatus" style="color: green; font-size: 0.8em;"></span>
    </div>
    <h1>My Timetable</h1>
    <table id="timetable">
        <thead><tr id="dayHeaders"><th class="period-col">Period</th></tr></thead>
        <tbody id="timetableBody"></tbody>
    </table>
</div>

<script>
    const subjects = ["Religion", "History", "Science", "English", "Maths", "Language: Italian", "Language: Japanese", "Language: Chinese", "Music", "Digital Technologies", "Personal Social Learning", "Junior Enhancement Mathematics", "Junior Enhancement English", "Junior Enhancement Science", "Junior Enhancement History", "Sport", "Physical Education", "Art", "Homework Club", "Instrumental Music", "Design and Technologies", "Design and Materials", "Pastoral"];
    const days = ["Day 1", "Day 2", "Day 3", "Day 4", "Day 5", "Day 6", "Day 7", "Day 8", "Day 9", "Day 10"];

    function init() {
        const header = document.getElementById('dayHeaders');
        const body = document.getElementById('timetableBody');
        days.forEach(d => { let th = document.createElement('th'); th.innerText = d; header.appendChild(th); });

        for (let p = 1; p <= 6; p++) {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td class="period-col">P${p}<br><input type="text" class="time-input" placeholder="0:00"><span class="time-display-print" style="display:none"></span></td>`;
            for (let d = 0; d < 10; d++) {
                let td = document.createElement('td');
                let sel = document.createElement('select');
                sel.className = "subject-select";
                sel.innerHTML = `<option value="">--</option>` + subjects.map(s => `<option value="${s}">${s}</option>`).join('');
                sel.onchange = function() { adjustFont(this); save(); };
                td.appendChild(sel);
                tr.appendChild(td);
            }
            body.appendChild(tr);
        }
        load();
    }

    function adjustFont(el) {
        // Dynamic scaling based on character count
        const len = el.value.length;
        if (len > 25) el.style.fontSize = "0.45rem";
        else if (len > 15) el.style.fontSize = "0.55rem";
        else el.style.fontSize = "0.7rem";
    }

    function save() {
        const data = {
            times: Array.from(document.querySelectorAll('.time-input')).map(i => i.value),
            subjects: Array.from(document.querySelectorAll('.subject-select')).map(s => s.value)
        };
        localStorage.setItem('maz_data', JSON.stringify(data));
        document.getElementById('saveStatus').innerText = "Saved!";
    }

    function load() {
        const data = JSON.parse(localStorage.getItem('maz_data'));
        if (!data) return;
        document.querySelectorAll('.time-input').forEach((i, idx) => i.value = data.times[idx] || "");
        document.querySelectorAll('.subject-select').forEach((s, idx) => {
            s.value = data.subjects[idx] || "";
            adjustFont(s);
        });
    }

    function handlePrint() {
        document.querySelectorAll('.time-input').forEach(i => i.nextElementSibling.innerText = i.value);
        window.print();
    }

    window.onload = init;
</script>
</body>
</html>
