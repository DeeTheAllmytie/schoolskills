<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timetable Generator</title>
    <link href="fontawesome/css/fontawesome.css" rel="stylesheet" />
    <link href="fontawesome/css/brands.css" rel="stylesheet" />
    <link href="fontawesome/css/solid.css" rel="stylesheet" />
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: 'Roboto Condensed', sans-serif; 
            background-color: #8f70d1; 
        }
        .container { 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            width: 100vw; 
            background: white; 
            padding: 70px 10px 10px 10px; 
            box-sizing: border-box; 
        }
        h1 { 
            color: #003366; 
            text-align: center; 
            border-bottom: 2px solid black; 
            margin: 0 0 6px 0; 
            font-size: 1.2em; 
        }
        .controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 6px; 
        }

        /* Neat faded card bar for top actions & bottom toggles */
        .action-bar, .toggle-bar {
            background-color: #f1f3f5;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .action-bar {
            justify-content: space-between;
        }
        .action-note {
            margin: 0;
            font-size: 0.85rem;
            color: #495057;
            font-weight: bold;
        }
        .action-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .toggle-bar {
            justify-content: center;
            gap: 18px;
            margin-top: 6px;
            margin-bottom: 0;
        }

        .print-btn, .action-link { 
            background: steelblue; 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: bold; 
            font-size: 0.82rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            height: 30px;
            box-sizing: border-box;
            transition: background-color 0.15s ease;
        }
        .print-btn:hover, .action-link:hover {
            background: #36648b;
        }

        table { 
            width: 100%; 
            flex-grow: 1; 
            border-collapse: collapse; 
            border: 2px solid black; 
            table-layout: fixed; 
        }
        th, td { 
            border: 1px solid black; 
            text-align: center; 
            vertical-align: middle; 
            padding: 2px; 
            overflow: hidden; 
            word-wrap: break-word; 
            line-height: 1.1; 
        }
        
        th { 
            background-color: royalblue; 
            color: white; 
            font-size: 0.65rem; 
            height: 32px; 
        }
        .period-col { 
            background-color: #f8f9fa; 
            font-weight: bold; 
            width: 64px; 
            font-size: 0.65rem; 
        }
        .time-input { 
            width: 92%; 
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 0.6rem; 
            border: 1px solid #ccc; 
            border-radius: 2px;
            text-align: center; 
            margin-top: 2px;
        }

        /* The Subject Text Styling */
        select.subject-select { 
            width: 100%; 
            border: none; 
            background: transparent; 
            text-align: center; 
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 0.7rem; 
            appearance: none; 
            cursor: pointer;
            display: block; 
            white-space: normal;
        }

        /* Optional Sub-details underneath subject */
        .class-code {
            font-size: 0.58rem;
            color: #444;
            margin-top: 1px;
            display: none;
        }
        .room-code {
            font-size: 0.65rem;
            font-weight: bold;
            color: #222;
            margin-top: 2px;
            display: block;
        }
        .teacher-name {
            font-size: 0.6rem;
            color: #333;
            margin-top: 1px;
            display: none;
        }

        /* Toggle Switch Styling */
        .toggle-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #003366;
            cursor: pointer;
            user-select: none;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 32px;
            height: 17px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .2s;
            border-radius: 17px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 13px;
            width: 13px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }
        .switch input:checked + .slider {
            background-color: royalblue;
        }
        .switch input:checked + .slider:before {
            transform: translateX(15px);
        }

        .nav-links {
            flex-grow: 1;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: royalblue;
            height: 60px;
            padding: 0;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            border-bottom: 3px solid black;
            z-index: 1000;
        }

        .pagelink {
            background-color: transparent;
            color: white;
            text-decoration: none;
            padding: 18px 15px;
            display: inline-block;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: bold;
        }

        .pagelink:hover {
            background-color: rgba(223,220,227,0.5);
            border-bottom: 5px solid black;
        }

        @media print {
            @page { size: A5 landscape; margin: 0.2cm; }
            * { 
                font-family: 'Roboto Condensed', sans-serif !important; 
                font-weight: normal !important; 
            }
            .container { padding: 4px !important; }
            .controls, .time-input { display: none !important; }
            .period-col { width: 68px !important; }
            .time-display-print { 
                display: block !important; 
                font-size: 0.45rem !important; 
                white-space: nowrap !important; 
            }
            .hide-times .time-display-print {
                display: none !important;
            }
            table { height: 90%; }
            select.subject-select { 
                font-family: 'Roboto Condensed', sans-serif !important;
                font-weight: normal !important; 
                color: black; 
                text-transform: none !important; 
                font-size: 0.55rem; 
            }
            .class-code { font-weight: normal !important; font-size: 0.45rem; color: black; }
            .room-code { font-weight: normal !important; font-size: 0.5rem; color: black; }
            .teacher-name { font-weight: normal !important; font-size: 0.45rem; color: black; }
            th { background-color: #eee !important; color: black !important; font-weight: normal !important; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="controls" style="margin:0;">
        <nav>
            <div class="nav-links">
                <a href="index.html" class="pagelink"><i class="fa-solid fa-calendar-days"></i> Timetable Generator</a>
            </div>
            <div class="nav-links">
                <a href="cueGenerator.html" class="pagelink"><i class="fa-solid fa-book"></i> (NOW WORKING) Flashcard Generator</a>
            </div>
            <div class="nav-links">
                <a href="info.html" class="pagelink">INFO <i class="fa-solid fa-circle-info"></i></a>
            </div>
        </nav>
    </div>

    <div class="controls action-bar"> 
        <p class="action-note"><i class="fa-solid fa-circle-info"></i> Read info for print instructions</p>
        <div class="action-buttons">
            <button class="print-btn" onclick="handlePrint()">Print / Save as PDF</button>
            <a class="action-link" href="downloadusage.html">How To Upload Your Timetable</a>
            <a class="action-link" href="javascript:(function(){var row=document.querySelector('.timetable-small');if(!row)return;var periodMap={};var currentDayIndex=-1;row.querySelectorAll('table tr').forEach(tr=>{var th=tr.querySelector('th');var subjectEl=tr.querySelector('td .timetable-subject');if(th&&subjectEl){var fullTimeText=th.innerText||'';var metaText=tr.querySelector('time.meta')?.innerText||%27%27;var periodName=fullTimeText.replace(metaText,%27%27).trim();var className=subjectEl.querySelector(%27a%27)?.innerText.trim()||%27%27;var extraDiv=subjectEl.querySelector(%27div%27);var extraText=extraDiv?extraDiv.innerText.replace(className,%27%27).trim():%27%27;var bg=subjectEl.style.backgroundColor||%27%27;if(periodName.toLowerCase().includes(%27period 0%27)){currentDayIndex++;}if(!periodMap[periodName]){periodMap[periodName]={time:metaText.trim(),slots:[]};}while(periodMap[periodName].slots.length<currentDayIndex){periodMap[periodName].slots.push({className:%27%27,details:%27%27,bg:%27%27});}periodMap[periodName].slots[currentDayIndex]={className:className,details:extraText,bg:bg};}});var cleanData=[];for(var pName in periodMap){if(periodMap.hasOwnProperty(pName)){var slotsArray=[];for(var i=0;i<=currentDayIndex;i++){slotsArray.push(periodMap[periodName].slots[i]||{className:%27%27,details:%27%27,bg:%27%27});}cleanData.push({period:pName,time:periodMap[pName].time,slots:slotsArray});}}var rawStr=JSON.stringify(cleanData);var encStr=btoa(unescape(encodeURIComponent(rawStr)));var blob=new Blob([JSON.stringify({secureData:encStr},null,2)],{type:%27application/json%27});var a=document.createElement(%27a%27);a.href=URL.createObjectURL(blob);a.download=%27grid_timetable.json%27;document.body.appendChild(a);a.click();document.body.removeChild(a);})();">Download Timetable</a>
            <input type="file" id="timetableUpload" accept=".json" style="display: none;">
            <button onclick="document.getElementById('timetableUpload').click()" class="print-btn">
                Upload JSON Timetable
            </button>
        </div>
    </div>

    <h1>My Timetable</h1>

    <table id="timetableTable">
        <thead>
            <tr id="dayHeaders">
                <th class="period-col">Period</th>
            </tr>
        </thead>
        <tbody id="timetableBody"></tbody>
    </table>

    <div class="controls toggle-bar">
        <label class="toggle-item">
            <span class="switch">
                <input type="checkbox" id="toggleRoom" onchange="applyToggles()">
                <span class="slider"></span>
            </span>
            Room Codes
        </label>
        <label class="toggle-item">
            <span class="switch">
                <input type="checkbox" id="toggleTeacher" onchange="applyToggles()">
                <span class="slider"></span>
            </span>
            Teacher's Name
        </label>
        <label class="toggle-item">
            <span class="switch">
                <input type="checkbox" id="toggleYear" onchange="applyToggles()">
                <span class="slider"></span>
            </span>
            Year Level
        </label>
        <label class="toggle-item">
            <span class="switch">
                <input type="checkbox" id="toggleClassCode" onchange="applyToggles()">
                <span class="slider"></span>
            </span>
            Class Codes
        </label>
        <label class="toggle-item">
            <span class="switch">
                <input type="checkbox" id="toggleTimes" checked onchange="applyToggles()">
                <span class="slider"></span>
            </span>
            Period Times
        </label>
        <label class="toggle-item">
            <span class="switch">
                <input type="checkbox" id="toggleExtraPeriods" onchange="applyToggles()">
                <span class="slider"></span>
            </span>
            Period 0 &amp; 7
        </label>
    </div>
</div>

<script>
    const subjects = ["Religion", "History", "Science", "English", "Maths", "Language: Italian", "Language: Japanese", "Language: Chinese", "Music", "Digital Technologies", "Personal Social Learning", "Junior Enhancement Mathematics", "Junior Enhancement English", "Junior Enhancement Science", "Junior Enhancement History", "Sport", "Physical Education", "Art", "Homework Club", "Instrumental Music", "Design and Technologies", "Design and Materials", "Pastoral", "Visual Communication Design", "Geography"];
    const days = ["Day 1", "Day 2", "Day 3", "Day 4", "Day 5", "Day 6", "Day 7", "Day 8", "Day 9", "Day 10"];
    const periods = [0, 1, 2, 3, 4, 5, 6, 7];
    let lastUploadedData = null;

    function init() {
        const header = document.getElementById('dayHeaders');
        const body = document.getElementById('timetableBody');
        days.forEach(d => { let th = document.createElement('th'); th.innerText = d; header.appendChild(th); });

        periods.forEach(p => {
            let tr = document.createElement('tr');
            tr.dataset.period = p;
            if (p === 0 || p === 7) {
                tr.classList.add('extra-period-row');
                tr.style.display = 'none';
            }
            tr.innerHTML = `<td class="period-col">P${p}<br><input type="text" class="time-input" placeholder="0:00"><span class="time-display-print" style="display:none"></span></td>`;
            for (let d = 0; d < 10; d++) {
                let td = document.createElement('td');
                let sel = document.createElement('select');
                sel.className = "subject-select";
                sel.innerHTML = `<option value="">--</option>` + subjects.map(s => `<option value="${s}">${s}</option>`).join('');
                sel.onchange = function() { adjustFont(this); };
                td.appendChild(sel);

                let codeDiv = document.createElement('div');
                codeDiv.className = "class-code";
                td.appendChild(codeDiv);

                let roomDiv = document.createElement('div');
                roomDiv.className = "room-code";
                td.appendChild(roomDiv);

                let teacherDiv = document.createElement('div');
                teacherDiv.className = "teacher-name";
                td.appendChild(teacherDiv);

                tr.appendChild(td);
            }
            body.appendChild(tr);
        });
    }

    function parseDetails(details) {
        if (!details) return { classCode: "", room: "", teacher: "" };
        const cleaned = details.replace(/\s+/g, ' ').trim();

        const codeMatch = cleaned.match(/^(\([^)]+\))/);
        const classCode = codeMatch ? codeMatch[1] : "";

        const afterCode = cleaned.replace(/^\([^)]+\)\s*/, '').trim();
        const roomMatch = afterCode.match(/^([A-Z]{1,3}\d+\.\d+)\b/i);
        const room = roomMatch ? roomMatch[1] : "";
        const teacher = room ? afterCode.replace(roomMatch[0], '').trim() : afterCode;

        return { classCode, room, teacher };
    }

    function populateTimetable(timetableData) {
        lastUploadedData = timetableData;
        const showYear = document.getElementById('toggleYear').checked;
        const rows = document.querySelectorAll('#timetableBody tr');

        rows.forEach(tr => {
            const p = parseInt(tr.dataset.period, 10);
            const periodEntry = timetableData.find(item => item.period.trim().toLowerCase() === `period ${p}`);
            if (!periodEntry) return;

            const timeInput = tr.querySelector('.time-input');
            if (timeInput && periodEntry.time) {
                timeInput.value = periodEntry.time;
            }

            const cells = tr.querySelectorAll('td:not(.period-col)');
            periodEntry.slots.forEach((slot, dayIdx) => {
                const td = cells[dayIdx];
                if (!td) return;

                const sel = td.querySelector('.subject-select');
                const codeDiv = td.querySelector('.class-code');
                const roomDiv = td.querySelector('.room-code');
                const teacherDiv = td.querySelector('.teacher-name');

                td.style.backgroundColor = slot.bg || "";

                if (slot.className) {
                    const fullSubject = slot.className.trim();
                    const strippedSubject = fullSubject.replace(/^Year\s+\d+\s+/i, '').trim();

                    sel.dataset.fullSubject = fullSubject;
                    sel.dataset.strippedSubject = strippedSubject;

                    const targetSubject = showYear ? fullSubject : strippedSubject;
                    setSelectSubject(sel, targetSubject);
                } else {
                    delete sel.dataset.fullSubject;
                    delete sel.dataset.strippedSubject;
                    sel.value = "";
                }

                const { classCode, room, teacher } = parseDetails(slot.details);
                if (codeDiv) codeDiv.innerText = classCode;
                if (roomDiv) roomDiv.innerText = room;
                if (teacherDiv) teacherDiv.innerText = teacher;
            });
        });

        applyToggles();
    }

    function setSelectSubject(sel, subjectText) {
        if (!subjectText) {
            sel.value = "";
            return;
        }
        let matchedOption = Array.from(sel.options).find(opt =>
            opt.value.toLowerCase() === subjectText.toLowerCase()
        );

        if (!matchedOption) {
            matchedOption = Array.from(sel.options).find(opt =>
                opt.value !== "" && subjectText.toLowerCase().includes(opt.value.toLowerCase()) && !/^Year\s+\d+/i.test(subjectText)
            );
        }

        if (matchedOption) {
            sel.value = matchedOption.value;
        } else {
            let newOpt = document.createElement('option');
            newOpt.value = subjectText;
            newOpt.text = subjectText;
            sel.add(newOpt);
            sel.value = subjectText;
        }
        adjustFont(sel);
    }

    function applyToggles() {
        const showRoom = document.getElementById('toggleRoom').checked;
        const showTeacher = document.getElementById('toggleTeacher').checked;
        const showYear = document.getElementById('toggleYear').checked;
        const showClassCode = document.getElementById('toggleClassCode').checked;
        const showTimes = document.getElementById('toggleTimes').checked;
        const showExtraPeriods = document.getElementById('toggleExtraPeriods').checked;

        document.querySelectorAll('.room-code').forEach(el => {
            el.style.display = showRoom ? 'block' : 'none';
        });

        document.querySelectorAll('.teacher-name').forEach(el => {
            el.style.display = showTeacher ? 'block' : 'none';
        });

        document.querySelectorAll('.class-code').forEach(el => {
            el.style.display = showClassCode ? 'block' : 'none';
        });

        document.querySelectorAll('.time-input').forEach(el => {
            el.style.display = showTimes ? 'inline-block' : 'none';
        });

        const table = document.getElementById('timetableTable');
        if (table) {
            table.classList.toggle('hide-times', !showTimes);
        }

        document.querySelectorAll('.extra-period-row').forEach(tr => {
            tr.style.display = showExtraPeriods ? 'table-row' : 'none';
        });

        document.querySelectorAll('.subject-select').forEach(sel => {
            if (sel.dataset.fullSubject) {
                const target = showYear ? sel.dataset.fullSubject : sel.dataset.strippedSubject;
                setSelectSubject(sel, target);
            }
        });
    }

    document.getElementById('timetableUpload').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const rawData = JSON.parse(e.target.result);
                if (!rawData.secureData) {
                    alert("Invalid format: 'secureData' not found.");
                    return;
                }

                const binaryString = atob(rawData.secureData);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const decodedString = new TextDecoder('utf-8').decode(bytes);
                const timetableData = JSON.parse(decodedString);

                populateTimetable(timetableData);
            } catch (error) {
                console.error(error);
                alert("Error parsing JSON file.");
            }
        };
        reader.readAsText(file);
    });

    function adjustFont(el) {
        const len = el.value.length;
        if (len > 25) el.style.fontSize = "0.45rem";
        else if (len > 15) el.style.fontSize = "0.55rem";
        else el.style.fontSize = "0.7rem";
    }

    function handlePrint() {
        const showTimes = document.getElementById('toggleTimes').checked;
        document.querySelectorAll('.time-input').forEach(i => {
            i.nextElementSibling.innerText = showTimes ? i.value : "";
        });
        window.print();
    }

    window.onload = init;
</script>
</body>
</html>
