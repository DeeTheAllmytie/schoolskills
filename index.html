<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Generator</title>
    <style>
        @import url(https://fonts.googleapis.com/css2?family=Roboto);

        body {
            font-family: Roboto;
            background-color: yellow;
            line-height: 1.6;
            margin: auto;
            margin-top: 30px;
            padding-top: 60px;
        }

        .nav-links {
            flex-grow: 1;
            text-align: center;
        }

        .setting {
            background-color: rgba(223, 220, 227, 0);
            color: white;
            text-decoration: none;
            display: block;
            padding: 1.2% 10px;
            display: inline-block;
        }

        .mainContent {
            margin-left: 5px;
            margin-right: 5px;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .pagelink {
            background-color: rgba(223, 220, 227, 0);
            color: white;
            text-decoration: none;
            padding: 1.2% 15px;
            display: inline-block;
        }

        .info {
            display: inline-block;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 10px;
            background-color: rgba(223,220,227,0);
        }

        .pagelink:hover {
            background-color: rgba(223,220,227,0.5);
            border-bottom: 5px solid black;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            padding-top: 10px;
            padding-bottom: 10px;
            background-color: royalblue;
            height: 60px;
            text-align: right;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            border-bottom: 3px solid black;
            z-index: 1000;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .tagline {
            color: #777;
            font-style: italic;
        }

        .introduction {
            margin-bottom: 20px;
        }

        .options a.button {
            display: inline-block;
            padding: 10px 20px;
            background-color: deepskyblue; 
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 10px;
        }

        .options a.button:hover {
            background-color: blueviolet;
        }

        form {
            text-align: center;
            margin: auto;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.5);
            width: 40%;
        }

        h1 {
            text-decoration: underline;
        }

        /* --- Print & Custom Table Matching Elements --- */
        .print-btn-container {
            text-align: center;
            margin: 15px 0;
            display: none; /* Hidden until a file is loaded */
        }

        .print-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: deepskyblue;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .print-btn:hover {
            background-color: blueviolet;
        }

        /* Standard Timetable Grid Styling Matching Original Layout Expectation */
        .timetable-table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 15px;
        }

        .timetable-table th, .timetable-table td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }

        .timetable-table th {
            background-color: royalblue;
            color: white;
        }

        .timetable-cell {
            padding: 6px;
            margin-bottom: 4px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .timetable-cell p {
            margin: 4px 0 0 0;
            white-space: pre-wrap;
            font-size: 0.85em;
        }

        /* Print Media Target Adjustments */
        @media print {
            body {
                background-color: white !important;
                margin: 0;
                padding-top: 0;
                margin-top: 0;
            }
            nav, .timetable-upload-container, .print-btn-container {
                display: none !important;
            }
            .mainContent {
                margin: 0 !important;
                padding: 0 !important;
            }
            .timetable-table th {
                background-color: #333 !important;
                color: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .timetable-cell {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-links">
            <a href="#" class="pagelink">Timetable Generator</a>
            <a href="#" class="pagelink">Flashcard Generator</a>
        </div>
    </nav>

    <header>
        <h1>My Timetable</h1>
    </header>

    <div class="mainContent">
        <!-- Interactive Upload Framework Container -->
        <form id="uploadForm" onsubmit="event.preventDefault();" style="padding: 20px; margin-bottom: 20px;">
            <h3>Load Timetable File</h3>
            <p class="tagline">Select your base64-encoded .json timetable file configuration</p>
            <input type="file" id="timetableFile" accept=".json" style="margin: 10px 0;">
            <div id="uploadStatus" style="font-weight: bold; margin-top: 10px;"></div>
        </form>

        <!-- Printable Save Trigger Block -->
        <div id="printBtnContainer" class="print-btn-container">
            <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
        </div>

        <!-- Render Target Dynamic Matrix Node -->
        <div id="timetableDisplay"></div>
    </div>

    <script>
        document.getElementById('timetableFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const statusDiv = document.getElementById('uploadStatus');
            const printBtnDiv = document.getElementById('printBtnContainer');
            const displayDiv = document.getElementById('timetableDisplay');
            
            if (!file) return;

            statusDiv.style.color = "black";
            statusDiv.textContent = "Processing layout configuration...";

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const outerData = JSON.parse(event.target.result);
                    
                    if (!outerData.secureData) {
                        throw new Error("Missing 'secureData' wrapping element property field context.");
                    }

                    // Decode base64 stream back into raw schema text string array elements
                    const decodedString = atob(outerData.secureData);
                    const timetableData = JSON.parse(decodedString);
                    
                    // Fire layout parsing mapping pipeline matrix loop logic
                    renderGrid(timetableData);
                    
                    statusDiv.style.color = "green";
                    statusDiv.textContent = "✓ Timetable configuration rendered successfully.";
                    printBtnDiv.style.display = "block"; // Expose print action control node button elements
                } catch (error) {
                    console.error(error);
                    statusDiv.style.color = "red";
                    statusDiv.textContent = "Error: Invalid file mapping configuration structure.";
                    printBtnDiv.style.display = "none";
                    displayDiv.innerHTML = "";
                }
            };

            reader.readAsText(file);
        });

        function renderGrid(data) {
            const displayDiv = document.getElementById('timetableDisplay');
            
            if (!data || data.length === 0) {
                displayDiv.innerHTML = "<p>No active schedule array instances captured inside config file data.</p>";
                return;
            }

            // Establish columns matrix format maps explicitly to slots layout
            let html = `
                <table class="timetable-table">
                    <thead>
                        <tr>
                            <th style="width: 15%;">Period</th>
                            <th style="width: 20%;">Time</th>
                            <th>Slots</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(row => {
                let cellHtmlArray = [];
                
                if (row.slots && row.slots.length > 0) {
                    row.slots.forEach(slot => {
                        // Include nodes that contain either structural parameters
                        if (slot.className || slot.details) {
                            const bgStyle = slot.bg ? `style="background-color: ${slot.bg};"` : '';
                            cellHtmlArray.push(`
                                <div class="timetable-cell" ${bgStyle}>
                                    <strong>${slot.className || ''}</strong>
                                    <p>${slot.details || ''}</p>
                                </div>
                            `);
                        }
                    });
                }

                // If period configuration properties contain empty slot values
                let finalSlotsMarkup = cellHtmlArray.join('');
                if (!finalSlotsMarkup.trim()) {
                    finalSlotsMarkup = '<span style="color: #777; font-style: italic;">No Active Lesson Blocks</span>';
                }

                html += `
                    <tr>
                        <td><strong>${row.period}</strong></td>
                        <td>${row.time}</td>
                        <td>${finalSlotsMarkup}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            displayDiv.innerHTML = html;
        }
    </script>
</body>
</html>
