<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="nav-links">
            <a href="#" class="pagelink">Timetable Generator</a>
            <a href="#" class="pagelink">Flashcard Generator</a>
        </div>
    </nav>

    <header>
        <h1>Timetable System</h1>
        <p class="tagline">Upload your configurations to view your active schedule</p>
    </header>

    <!-- Upload Engine Area -->
    <div class="timetable-upload-container">
        <h3>Load Timetable File</h3>
        <p class="tagline">Select your base64-encoded .json timetable file to instantly map out your schedule blocks.</p>
        <label for="timetableFile" class="upload-btn">Choose JSON File</label>
        <input type="file" id="timetableFile" accept=".json" style="display: none;">
        <div id="uploadStatus" style="margin-top: 15px; font-weight: bold;"></div>
    </div>

    <!-- Container Area Where Timetable Will Be Generated -->
    <div id="timetableSection" class="mainContent">
        <!-- JavaScript loads layout output dynamically here -->
    </div>

    <!-- --- Integrated Upload, Decode & Render Logic Engine --- -->
    <script>
        document.getElementById('timetableFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const statusDiv = document.getElementById('uploadStatus');
            
            if (!file) return;

            statusDiv.style.color = "black";
            statusDiv.textContent = "Processing configuration data...";

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    // 1. Parse outer JSON config file framework 
                    const outerData = JSON.parse(event.target.result);
                    
                    if (!outerData.secureData) {
                        throw new Error("Invalid schema format: Missing core 'secureData' reference field.");
                    }

                    // 2. Clear out encrypted string wrapping arrays via base64 decryption (atob)
                    const decodedString = atob(outerData.secureData);
                    
                    // 3. Structural mapping directly to application variables 
                    const timetableArray = JSON.parse(decodedString);
                    
                    // 4. Fire dynamic layout compilation 
                    renderTimetable(timetableArray);
                    
                    statusDiv.style.color = "green";
                    statusDiv.textContent = "✓ Configuration applied successfully!";
                } catch (error) {
                    console.error(error);
                    statusDiv.style.color = "red";
                    statusDiv.textContent = "Error: Invalid data format or broken base64 schema payload string detected.";
                }
            };

            reader.readAsText(file);
        });

        function renderTimetable(data) {
            const container = document.getElementById('timetableSection');
            
            // Re-render baseline structural nodes
            container.innerHTML = "<h2 style='text-align: center; text-decoration: underline;'>My Timetable</h2>";

            if (!data || data.length === 0) {
                container.innerHTML += "<p style='text-align: center;'>No core schedules matched.</p>";
                return;
            }

            // Begin framework mapping for schedule layout table matrices
            let tableHtml = `
                <div class="timetable-responsive-wrapper">
                    <table class="timetable-grid">
                        <thead>
                            <tr>
                                <th>Period</th>
                                <th>Time window</th>
                                <th>Assigned Modules / Classes</th>
                            </tr>
                        </thead>
                        <tbody>`;

            data.forEach(row => {
                // Compile specific target properties contained in slots collection
                let slotsHtml = row.slots.map(slot => {
                    if (!slot.className && !slot.details) return '';
                    
                    // Handle and replace linebreaks cleanly inside parameters
                    const formattedDetails = (slot.details || '').replace(/\n/g, '<br>').replace(/\n/g, '<br>');
                    const bgStyle = slot.bg ? `style="background-color: ${slot.bg};"` : '';

                    return `
                        <div class="slot-badge" ${bgStyle}>
                            <strong>${slot.className || 'Class Module'}</strong>
                            <p>${formattedDetails}</p>
                        </div>
                    `;
                }).join('');

                // Check condition fallback for open or unassigned period spaces
                if (!slotsHtml.trim()) {
                    slotsHtml = `<span class="empty-period">No Active Lessons Scheduled</span>`;
                }

                tableHtml += `
                    <tr>
                        <td class="cell-period"><strong>${row.period}</strong></td>
                        <td class="cell-time">${row.time}</td>
                        <td class="cell-slots">${slotsHtml}</td>
                    </tr>`;
            });

            tableHtml += `</tbody></table></div>`;
            container.innerHTML += tableHtml;
        }
    </script>
</body>
</html>
