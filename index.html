<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timetable Generator</title>
    <link href="fontawesome/css/fontawesome.css" rel="stylesheet" />
    <link href="fontawesome/css/brands.css" rel="stylesheet" />
    <link href="fontawesome/css/solid.css" rel="stylesheet" />
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --custom-font: 'Roboto Condensed', Arial, sans-serif; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Roboto Condensed', Arial, sans-serif; background-color: #8f70d1; }
        .container { display: flex; flex-direction: column; height: 100vh; width: 100vw; background: white; padding: 10px; box-sizing: border-box; }
        
        .title-wrapper { text-align: center; border-bottom: 2px solid black; margin: 0 0 6px 0; }
        #timetableTitle {
            color: #003366;
            text-align: center;
            border: none;
            background: transparent;
            font-family: var(--custom-font);
            font-size: 1.2em;
            font-weight: bold;
            width: 100%;
            outline: none;
            padding: 2px 0;
        }
        #timetableTitle:hover, #timetableTitle:focus {
            background-color: #f8f9fa;
        }

        .controls { display: flex; justify-content: space-between; margin-bottom: 5px; }
        
        /* Matching Faded Top Action Bar */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f1f3f5;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 6px 12px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .action-bar p {
            margin: 0;
            font-size: 0.85rem;
            color: #333;
        }
        .action-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .print-btn, .action-buttons a {
            background: steelblue;
            color: white;
            border: none;
            height: 30px;
            line-height: 30px;
            padding: 0 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Roboto Condensed', Arial, sans-serif;
            font-weight: bold;
            font-size: 0.82rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .print-btn:hover, .action-buttons a:hover {
            background: #3a6ea5;
        }

        table { width: 100%; flex-grow: 1; border-collapse: collapse; border: 2px solid black; table-layout: fixed; font-family: var(--custom-font); }
        th, td { border: 1px solid black; text-align: center; vertical-align: middle; padding: 2px; overflow: hidden; word-wrap: break-word; line-height: 1.08; font-family: var(--custom-font); }
        
        th { background-color: royalblue; color: white; font-size: 0.6rem; height: 28px; }
        .period-col { background-color: #f8f9fa; font-weight: bold; width: 65px; font-size: 0.65rem; }
        .time-input { 
            width: 95%; 
            font-family: var(--custom-font); 
            font-size: 0.6rem; 
            border: 1px solid #ccc; 
            text-align: center; 
            margin-top: 2px; 
            box-sizing: border-box;
            padding: 1px;
        }

        /* Subject Textarea Styling (allows max 2 lines + auto-resizing) */
        textarea.subject-select { 
            width: 100%; 
            border: none; 
            background: transparent; 
            text-align: center; 
            font-family: var(--custom-font);
            font-size: 0.7rem; 
            line-height: 1.08;
            cursor: text;
            display: block; 
            box-sizing: border-box;
            outline: none;
            padding: 0 2px;
            resize: none;
            overflow: hidden;
            white-space: normal;
            word-break: normal;
            overflow-wrap: break-word;
            margin: 0;
        }
        textarea.subject-select:focus {
            background-color: rgba(255, 255, 255, 0.75);
        }

        /* Print-only subject mirror so print layout never clips textarea height */
        .subject-print {
            display: none;
            width: 100%;
            text-align: center;
            white-space: normal;
            word-break: normal;
            overflow-wrap: break-word;
            line-height: 1.05;
            margin: 0;
            padding: 0 1px;
            box-sizing: border-box;
        }

        /* Sub-elements inside cell */
        .class-code, .room-code, .teacher-name {
            font-size: 0.58rem;
            line-height: 1.05;
            margin-top: 1px;
            display: block;
            white-space: nowrap;
            overflow: hidden;
        }
        .room-code {
            font-weight: bold;
            color: #111;
        }
        .class-code, .teacher-name {
            color: #333;
        }

        /* Bottom Toggle Bar */
        .toggle-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            background-color: #f1f3f5;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 6px 12px;
            margin-top: 6px;
            margin-bottom: 0;
        }
        .toggle-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #212529;
            cursor: pointer;
            user-select: none;
        }
        .font-control {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #212529;
            border-left: 1px solid #ccc;
            padding-left: 14px;
        }
        .font-input {
            font-family: inherit;
            font-size: 0.78rem;
            padding: 2px 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 120px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 32px;
            height: 18px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: 0.2s;
            border-radius: 18px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.2s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: steelblue;
        }
        input:checked + .slider:before {
            transform: translateX(14px);
        }

        .nav-links {
            flex-grow: 1;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: royalblue;
            height: 60px;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            border-bottom: 3px solid black;
            z-index: 1000;
        }

        .pagelink {
            background-color: rgba(223, 220, 227, 0);
            color: white;
            text-decoration: none;
            padding: 1.2% 15px;
            display: inline-block;
            font-weight: bold;
        }

        .pagelink:hover {
            background-color: rgba(223,220,227,0.5);
            border-bottom: 5px solid black;
        }

        @media print {
            @page { size: A5 landscape; margin: 0.45cm; }
            * { 
                font-family: var(--custom-font), sans-serif !important;
                font-weight: normal !important; 
            }
            html, body {
                background: white !important;
                height: 100% !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
            }
            .container {
                padding: 2mm 3mm !important;
                height: 100vh !important;
                width: 100vw !important;
                display: flex !important;
                flex-direction: column !important;
                box-sizing: border-box !important;
            }
            table, table * {
                font-family: var(--custom-font) !important;
            }
            .controls, .action-bar, .toggle-bar, .time-input, textarea.subject-select { display: none !important; }
            .title-wrapper { 
                border-bottom: 1px solid black !important; 
                margin: 0 0 2px 0 !important;
                flex-shrink: 0 !important;
            }
            #timetableTitle { 
                color: black !important; 
                font-size: 0.8rem !important; 
                padding: 0 0 1px 0 !important;
            }
            .period-col { width: 54px !important; }
            .time-display-print.show-time { 
                display: block !important; 
                font-size: 0.38rem !important; 
                line-height: 1 !important;
                white-space: nowrap !important; 
            }
            table { 
                width: 100% !important; 
                height: auto !important;
                flex-grow: 1 !important;
                table-layout: fixed !important;
                border-collapse: collapse !important;
            }
            th { 
                background-color: #eee !important; 
                color: black !important; 
                font-weight: normal !important; 
                height: 14px !important;
                font-size: 0.5rem !important;
                padding: 1px !important;
            }
            td {
                padding: 1px 1px !important;
                line-height: 1.02 !important;
                overflow: hidden !important;
            }
            .subject-print {
                display: block !important;
                color: black !important;
                line-height: 1.02 !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .room-code, .teacher-name, .class-code { 
                font-weight: normal !important; 
                line-height: 1.0 !important;
                margin-top: 0.5px !important;
                color: black !important; 
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="controls">
        <nav>
            <div class="nav-links">
                <a href="index.html" class="pagelink"><i class="fa-solid fa-calendar-days"></i> Timetable Generator</a>
            </div>
            <div class="nav-links">
                <a href="cueGenerator.html" class="pagelink"><i class="fa-solid fa-book"></i> Flashcard Generator</a>
            </div>
            <div class="nav-links">
                <a href="info.html" class="pagelink"><i class="fa-solid fa-circle-info"></i> INFO</a>
            </div>
        </nav>
    </div>
    <div class="controls" style="height: 55px;"></div>

    <div class="action-bar"> 
        <p>Important information like print settings, how to upload timetable and how to change fonts are on the info tab.</p>
        <div class="action-buttons">
            <button class="print-btn" onclick="handlePrint()">Print / Save as PDF</button>
            <input type="file" id="timetableUpload" accept=".json" style="display: none;">
            <button onclick="document.getElementById('timetableUpload').click()" class="print-btn">
                Upload Timetable
            </button>
        </div>
    </div>

    <div class="title-wrapper">
        <input type="text" id="timetableTitle" value="My Timetable" aria-label="Timetable Title">
    </div>

    <table>
        <thead>
            <tr id="dayHeaders">
                <th class="period-col">Period</th>
            </tr>
        </thead>
        <tbody id="timetableBody"></tbody>
    </table>

    <div class="controls toggle-bar">
        <label class="toggle-item">
            <span class="switch">
                <input type="checkbox" id="toggleRoom" onchange="applyToggles()">
                <span class="slider"></span>
            </span>
            Room Codes
        </label>
        <label class="toggle-item">
            <span class="switch">
                <input type="checkbox" id="toggleTeacher" onchange="applyToggles()">
                <span class="slider"></span>
            </span>
            Teacher's Name
        </label>
        <label class="toggle-item">
            <span class="switch">
                <input type="checkbox" id="toggleYear" onchange="applyToggles()">
                <span class="slider"></span>
            </span>
            Year Level
        </label>
        <label class="toggle-item">
            <span class="switch">
                <input type="checkbox" id="toggleClassCode" onchange="applyToggles()">
                <span class="slider"></span>
            </span>
            Class Codes
        </label>
        <label class="toggle-item">
            <span class="switch">
                <input type="checkbox" id="toggleTimes" checked onchange="applyToggles()">
                <span class="slider"></span>
            </span>
            Period Times
        </label>
        <label class="toggle-item">
            <span class="switch">
                <input type="checkbox" id="togglePastoral" onchange="applyToggles()">
                <span class="slider"></span>
            </span>
            Pastoral
        </label>
        <label class="toggle-item">
            <span class="switch">
                <input type="checkbox" id="toggleP0P7" onchange="applyToggles()">
                <span class="slider"></span>
            </span>
            Period 0 &amp; 7
        </label>
        <div class="font-control">
            <label for="customFontInput">Font Name:</label>
            <input type="text" id="customFontInput" class="font-input" list="fontSuggestions" placeholder="e.g. Arial, Poppins">
            <datalist id="fontSuggestions">
                <option value="Roboto Condensed">
                <option value="Arial">
                <option value="Calibri">
                <option value="Comic Sans MS">
                <option value="Courier New">
                <option value="Georgia">
                <option value="Montserrat">
                <option value="Open Sans">
                <option value="Poppins">
                <option value="Times New Roman">
            </datalist>
        </div>
    </div>
</div>

<script>
    const subjects = ["Religion", "History", "Science", "English", "Maths", "Language: Italian", "Language: Japanese", "Language: Chinese", "Music", "Digital Technologies", "Personal Social Learning", "Enhancement Mathematics", "Enhancement English", "Enhancement Science", "Enhancement History", "Sport", "Physical Education", "Art", "Homework Club", "Instrumental Music", "Design and Technologies", "Design and Materials", "Pastoral", "Visual Communication Design", "Geography", "STEM - Robotics", "Software Development Programing", "Legal Studies", "Politics", "Financial Literacy", "Forensic Science", "Literature", "Food Technology", "Sports Science", "Drama"];
    const days = ["Day 1", "Day 2", "Day 3", "Day 4", "Day 5", "Day 6", "Day 7", "Day 8", "Day 9", "Day 10"];

    const rowDefinitions = [
        { key: "period 0", label: "P0", rowClass: "row-p0p7" },
        { key: "pastoral", label: "Pastoral", rowClass: "row-pastoral" },
        { key: "period 1", label: "P1", rowClass: "row-main" },
        { key: "period 2", label: "P2", rowClass: "row-main" },
        { key: "period 3", label: "P3", rowClass: "row-main" },
        { key: "period 4", label: "P4", rowClass: "row-main" },
        { key: "period 5", label: "P5", rowClass: "row-main" },
        { key: "period 6", label: "P6", rowClass: "row-main" },
        { key: "period 7", label: "P7", rowClass: "row-p0p7" }
    ];

    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');

    function getActiveFontFamily() {
        const val = getComputedStyle(document.documentElement).getPropertyValue('--custom-font').trim();
        return val || "'Roboto Condensed', Arial, sans-serif";
    }

    function measureTextWidth(text, fontSizePx, isBold = false) {
        measureCtx.font = `${isBold ? 'bold ' : ''}${fontSizePx}px ${getActiveFontFamily()}`;
        return measureCtx.measureText(text).width;
    }

    /* Checks if text wraps onto at most maxLines within maxWidthPx without breaking words */
    function fitsInMaxLines(text, fontSizePx, maxWidthPx, maxLines = 2) {
        if (!text) return true;
        const words = text.split(/\s+/);
        let lines = 1;
        let currentLine = "";

        for (let i = 0; i < words.length; i++) {
            const word = words[i];
            if (measureTextWidth(word, fontSizePx) > maxWidthPx) {
                return false;
            }
            const testLine = currentLine ? currentLine + " " + word : word;
            if (measureTextWidth(testLine, fontSizePx) <= maxWidthPx) {
                currentLine = testLine;
            } else {
                lines++;
                currentLine = word;
                if (lines > maxLines) {
                    return false;
                }
            }
        }
        return true;
    }

    function countWrappedLines(text, fontSizePx, maxWidthPx) {
        if (!text) return 0;
        const words = text.split(/\s+/);
        let lines = 1;
        let currentLine = "";
        for (let i = 0; i < words.length; i++) {
            const word = words[i];
            const testLine = currentLine ? currentLine + " " + word : word;
            if (measureTextWidth(testLine, fontSizePx) <= maxWidthPx) {
                currentLine = testLine;
            } else {
                lines++;
                currentLine = word;
            }
        }
        return lines;
    }

    function init() {
        const header = document.getElementById('dayHeaders');
        const body = document.getElementById('timetableBody');
        days.forEach(d => {
            let th = document.createElement('th');
            th.innerText = d;
            header.appendChild(th);
        });

        rowDefinitions.forEach(def => {
            let tr = document.createElement('tr');
            tr.dataset.periodKey = def.key;
            tr.className = def.rowClass;
            tr.innerHTML = `<td class="period-col"><span class="period-label">${def.label}</span><br><input type="text" class="time-input" placeholder="0:00" oninput="adjustTimeFont(this)"><span class="time-display-print" style="display:none"></span></td>`;

            for (let d = 0; d < 10; d++) {
                let td = document.createElement('td');
                
                let inp = document.createElement('textarea');
                inp.rows = 1;
                inp.className = "subject-select";
                inp.placeholder = "--";
                inp.onkeydown = function(e) {
                    if (e.key === 'Enter') e.preventDefault();
                };
                inp.oninput = function() {
                    delete this.dataset.fullSubject;
                    delete this.dataset.strippedSubject;
                    adjustFont(this);
                };
                td.appendChild(inp);

                let printDiv = document.createElement('div');
                printDiv.className = "subject-print";
                td.appendChild(printDiv);

                let classCodeDiv = document.createElement('div');
                classCodeDiv.className = "class-code";
                td.appendChild(classCodeDiv);

                let roomDiv = document.createElement('div');
                roomDiv.className = "room-code";
                td.appendChild(roomDiv);

                let teacherDiv = document.createElement('div');
                teacherDiv.className = "teacher-name";
                td.appendChild(teacherDiv);

                tr.appendChild(td);
            }
            body.appendChild(tr);
        });

        applyToggles();
    }

    function parseSlotDetails(details) {
        if (!details) return { classCode: "", room: "", teacher: "" };
        const cleaned = details.replace(/\s+/g, ' ').trim();

        let classCode = "";
        let remainder = cleaned;

        const codeMatch = cleaned.match(/^(\([^)]+\))\s*(.*)$/);
        if (codeMatch) {
            classCode = codeMatch[1].trim();
            remainder = codeMatch[2].trim();
        }

        let room = "";
        let teacher = remainder;
        const roomMatch = remainder.match(/^([A-Z]{1,4}\d+(?:\.\d+)?)\b\s*(.*)$/i);
        if (roomMatch) {
            room = roomMatch[1].trim();
            teacher = roomMatch[2].trim();
        }

        return { classCode, room, teacher };
    }

    function populateTimetable(timetableData) {
        const rows = document.querySelectorAll('#timetableBody tr');

        rows.forEach(tr => {
            const pKey = tr.dataset.periodKey;
            const periodEntry = timetableData.find(item => item.period && item.period.trim().toLowerCase() === pKey);
            if (!periodEntry) return;

            const timeInput = tr.querySelector('.time-input');
            if (timeInput) {
                timeInput.value = periodEntry.time || "";
                adjustTimeFont(timeInput);
            }

            const cells = tr.querySelectorAll('td:not(.period-col)');
            (periodEntry.slots || []).forEach((slot, dayIdx) => {
                const td = cells[dayIdx];
                if (!td) return;

                const inp = td.querySelector('.subject-select');
                const classCodeDiv = td.querySelector('.class-code');
                const roomDiv = td.querySelector('.room-code');
                const teacherDiv = td.querySelector('.teacher-name');

                td.style.backgroundColor = slot.bg || "";

                if (slot.className) {
                    const fullClassName = slot.className.trim();
                    const strippedClassName = fullClassName.replace(/^Year\s+\d+\s+/i, '').trim();

                    inp.dataset.fullSubject = fullClassName;
                    inp.dataset.strippedSubject = strippedClassName;

                    setSelectSubjectText(inp);
                } else {
                    delete inp.dataset.fullSubject;
                    delete inp.dataset.strippedSubject;
                    inp.value = "";
                    adjustFont(inp);
                }

                const parsed = parseSlotDetails(slot.details);
                classCodeDiv.innerText = parsed.classCode;
                roomDiv.innerText = parsed.room;
                teacherDiv.innerText = parsed.teacher;
            });
        });

        applyToggles();
    }

    function setSelectSubjectText(inp) {
        if (!inp.dataset.fullSubject) {
            adjustFont(inp);
            return;
        }
        const showYear = document.getElementById('toggleYear').checked;
        const targetText = showYear ? inp.dataset.fullSubject : inp.dataset.strippedSubject;

        if (showYear) {
            inp.value = targetText;
        } else {
            const matchedSubject = subjects.find(s =>
                s.toLowerCase() === targetText.toLowerCase() ||
                targetText.toLowerCase().includes(s.toLowerCase())
            );
            inp.value = matchedSubject || targetText;
        }
        adjustFont(inp);
    }

    function applyToggles() {
        const showRoom = document.getElementById('toggleRoom').checked;
        const showTeacher = document.getElementById('toggleTeacher').checked;
        const showClassCode = document.getElementById('toggleClassCode').checked;
        const showTimes = document.getElementById('toggleTimes').checked;
        const showPastoral = document.getElementById('togglePastoral').checked;
        const showP0P7 = document.getElementById('toggleP0P7').checked;

        document.querySelectorAll('.room-code').forEach(el => {
            el.style.display = (showRoom && el.innerText.trim() !== "") ? 'block' : 'none';
        });

        document.querySelectorAll('.teacher-name').forEach(el => {
            el.style.display = (showTeacher && el.innerText.trim() !== "") ? 'block' : 'none';
        });

        document.querySelectorAll('.class-code').forEach(el => {
            el.style.display = (showClassCode && el.innerText.trim() !== "") ? 'block' : 'none';
        });

        document.querySelectorAll('.subject-select').forEach(inp => {
            setSelectSubjectText(inp);
        });

        document.querySelectorAll('.time-input').forEach(inp => {
            inp.style.display = showTimes ? 'inline-block' : 'none';
            if (showTimes) adjustTimeFont(inp);
        });

        document.querySelectorAll('.row-pastoral').forEach(tr => {
            tr.style.display = showPastoral ? '' : 'none';
        });

        document.querySelectorAll('.row-p0p7').forEach(tr => {
            tr.style.display = showP0P7 ? '' : 'none';
        });

        fitAllText();
    }

    document.getElementById('timetableUpload').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const rawData = JSON.parse(e.target.result);
                if (!rawData.secureData) {
                    alert("Invalid format: 'secureData' not found.");
                    return;
                }

                const binaryString = atob(rawData.secureData);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const decodedString = new TextDecoder('utf-8').decode(bytes);
                const timetableData = JSON.parse(decodedString);

                populateTimetable(timetableData);
            } catch (error) {
                console.error(error);
                alert("Error parsing JSON file.");
            } finally {
                event.target.value = '';
            }
        };
        reader.readAsText(file);
    });

    /* Shrinks font size until subject fits in a maximum of 2 lines AND fits vertically inside the cell */
    function adjustFont(el) {
        const td = el.closest('td');
        if (!td || td.offsetParent === null) return;

        const text = el.value.trim();
        let fontSize = 11.2;
        const minFontSize = 5.0;

        if (!text) {
            el.style.fontSize = fontSize + 'px';
            el.style.height = '14px';
            return;
        }

        const tdStyle = window.getComputedStyle(td);
        const padH = parseFloat(tdStyle.paddingLeft) + parseFloat(tdStyle.paddingRight);
        const padV = parseFloat(tdStyle.paddingTop) + parseFloat(tdStyle.paddingBottom);
        const availableWidth = Math.max(20, td.clientWidth - padH - 4);

        let extraHeight = 0;
        td.querySelectorAll('.class-code, .room-code, .teacher-name').forEach(sub => {
            if (sub.style.display !== 'none') {
                sub.style.fontSize = '9.2px';
                const subWidth = measureTextWidth(sub.innerText.trim(), 9.2);
                if (subWidth > availableWidth) {
                    const scaledSub = Math.max(5.0, 9.2 * (availableWidth / subWidth));
                    sub.style.fontSize = scaledSub + 'px';
                }
                extraHeight += sub.offsetHeight + 1;
            }
        });
        const maxAllowedHeight = Math.max(12, td.clientHeight - padV - extraHeight);

        while (fontSize > minFontSize) {
            const fits2Lines = fitsInMaxLines(text, fontSize, availableWidth, 2);
            const lineCount = countWrappedLines(text, fontSize, availableWidth);
            const estimatedHeight = lineCount * (fontSize * 1.1) + 2;

            if (fits2Lines && estimatedHeight <= maxAllowedHeight) {
                break;
            }
            fontSize -= 0.3;
        }

        el.style.fontSize = fontSize + 'px';
        el.style.height = 'auto';
        el.style.height = Math.min(maxAllowedHeight, el.scrollHeight) + 'px';
    }

    function adjustTimeFont(el) {
        if (!el || el.offsetParent === null) return;
        let fontSize = 9.5;
        const minFontSize = 5.0;
        const text = el.value.trim();
        if (!text) {
            el.style.fontSize = fontSize + 'px';
            return;
        }
        const maxW = Math.max(20, el.clientWidth - 4);
        while (fontSize > minFontSize && measureTextWidth(text, fontSize) > maxW) {
            fontSize -= 0.4;
        }
        el.style.fontSize = fontSize + 'px';
    }

    function fitAllText() {
        document.querySelectorAll('.subject-select').forEach(adjustFont);
        document.querySelectorAll('.time-input').forEach(adjustTimeFont);
    }

    function syncPrintView() {
        const showTimes = document.getElementById('toggleTimes').checked;
        const showRoom = document.getElementById('toggleRoom').checked;
        const showTeacher = document.getElementById('toggleTeacher').checked;
        const showClassCode = document.getElementById('toggleClassCode').checked;

        document.querySelectorAll('.time-input').forEach(i => {
            const span = i.nextElementSibling;
            span.innerText = i.value;
            if (showTimes && i.value.trim() !== "") {
                span.classList.add('show-time');
            } else {
                span.classList.remove('show-time');
            }
        });

        // A5 landscape printable width & height (210mm x 148mm minus 0.45cm margins & container padding)
        const a5PrintableWidthPx = 735;
        const a5PrintableHeightPx = 505;
        const periodColWidthPx = 54;
        const a5CellWidthPx = Math.max(42, ((a5PrintableWidthPx - periodColWidthPx) / 10) - 4);

        // Count visible rows so height scales properly even when Pastoral AND P0 & P7 are all enabled (9 rows)
        const visibleRows = Array.from(document.querySelectorAll('#timetableBody tr')).filter(
            tr => tr.style.display !== 'none'
        );
        const visibleRowCount = Math.max(1, visibleRows.length);
        const titleAndHeaderHeight = 32;
        const rowBudgetPx = Math.max(24, (a5PrintableHeightPx - titleAndHeaderHeight) / visibleRowCount - 3);

        // Scale period label & time slightly when 9 rows are active so period-col never stretches row height
        const isDenseRows = visibleRowCount >= 8;
        document.querySelectorAll('.period-col').forEach(td => {
            const lbl = td.querySelector('.period-label');
            const timeSpan = td.querySelector('.time-display-print');
            if (lbl) lbl.style.fontSize = isDenseRows ? '6.5px' : '8px';
            if (timeSpan) timeSpan.style.fontSize = isDenseRows ? '5px' : '6px';
        });

        // Calculate how many sub-lines are enabled (0 to 3)
        const activeSubLines = (showClassCode ? 1 : 0) + (showRoom ? 1 : 0) + (showTeacher ? 1 : 0);

        // Dynamically size sub-lines based on total rows & active toggles so 9 rows x 5 lines fits A5
        let baseSubFontPx = 6.2;
        if (visibleRowCount >= 9 && activeSubLines >= 3) {
            baseSubFontPx = 4.3;
        } else if (visibleRowCount >= 8 && activeSubLines >= 2) {
            baseSubFontPx = 4.8;
        } else if (visibleRowCount >= 7 && activeSubLines >= 3) {
            baseSubFontPx = 5.0;
        } else if (activeSubLines >= 3) {
            baseSubFontPx = 5.4;
        }

        document.querySelectorAll('#timetableBody td:not(.period-col)').forEach(td => {
            const inp = td.querySelector('.subject-select');
            const printDiv = td.querySelector('.subject-print');
            if (!inp || !printDiv) return;

            const text = inp.value.trim();
            printDiv.innerText = text;

            let visibleSubCount = 0;
            let usedSubHeight = 0;
            td.querySelectorAll('.class-code, .room-code, .teacher-name').forEach(sub => {
                if (sub.style.display !== 'none' && sub.innerText.trim() !== "") {
                    visibleSubCount++;
                    let subFont = baseSubFontPx;
                    const subW = measureTextWidth(sub.innerText.trim(), subFont);
                    if (subW > a5CellWidthPx) {
                        subFont = Math.max(3.6, subFont * (a5CellWidthPx / subW));
                    }
                    sub.style.fontSize = subFont + 'px';
                    usedSubHeight += subFont * 1.05 + 0.5;
                }
            });

            const availableSubjectHeight = Math.max(9, rowBudgetPx - usedSubHeight);

            // Start subject font proportional to row density and shrink until it fits <= 2 lines AND fits row budget
            let printFontSize = visibleRowCount >= 9 ? 6.6 : (visibleRowCount >= 8 ? 7.2 : 8.2);
            const minPrintFont = 3.8;
            while (printFontSize > minPrintFont) {
                const fits2Lines = fitsInMaxLines(text, printFontSize, a5CellWidthPx, 2);
                const lines = countWrappedLines(text, printFontSize, a5CellWidthPx);
                const subjectHeight = lines * (printFontSize * 1.05);
                if (fits2Lines && subjectHeight <= availableSubjectHeight) {
                    break;
                }
                printFontSize -= 0.2;
            }
            printDiv.style.fontSize = printFontSize + 'px';
        });
    }

    function handlePrint() {
        syncPrintView();
        window.print();
    }

    const customFontInput = document.getElementById('customFontInput');

    customFontInput.addEventListener('input', function(e) {
        const fontName = e.target.value.trim();
        if (!fontName) {
            document.documentElement.style.setProperty('--custom-font', "'Roboto Condensed', Arial, sans-serif");
        } else {
            document.documentElement.style.setProperty('--custom-font', `'${fontName}', sans-serif`);
        }
        setTimeout(fitAllText, 50);
    });

    window.addEventListener('resize', fitAllText);
    window.addEventListener('beforeprint', syncPrintView);
    window.addEventListener('afterprint', applyToggles);

    window.onload = init;
</script>
</body>
</html>
