<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="main.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="fontawesome/css/fontawesome.css" rel="stylesheet" />
        <link href="fontawesome/css/brands.css" rel="stylesheet" />
        <link href="fontawesome/css/solid.css" rel="stylesheet" />
        <link rel="icon" href="icon.ico" type="image/x-icon">
        <style>
            table {
                width: 100%;
                border-collapse: collapse;
            }
            td {
                border: 2px dashed #333;
                height: 90px; /* Gives the cells a flashcard-like height */
                width: 50%;
                text-align: center;
                vertical-align: middle;
                padding: 10px;
                box-sizing: border-box;
            }
        </style>
        <title>Personal Timetable Generator</title>
    </head>
    <body>
        <nav>
            <div class="nav-links">
                <a href="index.html" class="pagelink"><i class="fa-solid fa-calendar-days"></i> Timetable generator</a>
            </div>
            <div class="nav-links">
                <a href="cueGenerator.html" class="pagelink"><i class="fa-solid fa-book"></i> (NEW) Flashcard Generator</a>
            </div>
        </nav>

        <!-- Added an ID to the form to target its rows easily -->
        <form id="flashcardForm" onsubmit="event.preventDefault(); createFlashcard();">
            <h1>Flashcard Generator</h1>
            <table>
                <tr><th>Question</th><th>Answer</th></tr>
                <tr class="card-row"><td><input type="text"></td><td><input type="text"></td></tr>
                <tr class="card-row"><td><input type="text"></td><td><input type="text"></td></tr>
                <tr class="card-row"><td><input type="text"></td><td><input type="text"></td></tr>
                <tr class="card-row"><td><input type="text"></td><td><input type="text"></td></tr>
                <tr class="card-row"><td><input type="text"></td><td><input type="text"></td></tr>
            </table>
            <button type="submit">Generate & Print Flashcards</button>
        </form>

    </body>
    <script>
        function createFlashcard() {
            // Find all table rows containing inputs
            var rows = document.querySelectorAll('#flashcardForm .card-row');
            var tableBodyHtml = '';

            // Loop through each input row to extract values and build dynamic printable HTML
            rows.forEach(function(row) {
                var inputs = row.querySelectorAll('input[type="text"]');
                var questionText = inputs[0].value.trim();
                var answerText = inputs[1].value.trim();

                // Only generate a printed card if at least one of the fields has text
                if (questionText !== '' || answerText !== '') {
                    tableBodyHtml += `
                        <tr>
                            <td>${questionText}</td>
                            <td>${answerText}</td>
                        </tr>
                    `;
                }
            });

            // Fallback if the user clicks print while all input boxes are completely empty
            if (tableBodyHtml === '') {
                tableBodyHtml = '<tr><td colspan="2">No flashcards to print. Please fill out the form.</td></tr>';
            }

            // Open a blank new window
            var printWindow = window.open('', '_blank');
            
            // Build the HTML structure for the new page using our dynamic table rows
            var htmlContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Print Flashcards</title>
                    <style>
                        body {
                            font-family: Arial, sans-serif;
                            margin: 20px;
                        }
                        table {
                            width: 100%;
                            border-collapse: collapse;
                        }
                        td {
                            border: 2px dashed #333;
                            height: 180px; /* Gives the cells a flashcard-like height */
                            width: 50%;
                            text-align: center;
                            vertical-align: middle;
                            padding: 10px;
                            box-sizing: border-box;
                        }
                    </style>
                </head>
                <body>
                    <table>
                        ${tableBodyHtml}
                    </table>
                    <script>
                        window.onload = function() {
                            window.print();
                        };
                    <\/script>
                </body>
                </html>
            `;
            
            // Write the generated content into the new window and close the stream to finalize loading
            printWindow.document.write(htmlContent);
            printWindow.document.close();
        }
    </script>
</html>
