<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="main.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="fontawesome/css/fontawesome.css" rel="stylesheet" />
        <link href="fontawesome/css/brands.css" rel="stylesheet" />
        <link href="fontawesome/css/solid.css" rel="stylesheet" />
        <link rel="icon" href="icon.ico" type="image/x-icon">
        <style>
            table {
                width: 100%;
                border-collapse: collapse;
            }
            td {
                border: 2px dashed #333;
                height: 90px; /* Gives the cells a flashcard-like height */
                width: 50%;
                text-align: center;
                vertical-align: middle;
                padding: 0px;
                box-sizing: border-box;
            }
            input {
                background-color: rgba(0, 0, 0, 0); /* 50% transparent black background; text stays solid */
                width: 100%;
                height: 100%;
                text-align: center;
            }
        </style>
        <title>Personal Timetable Generator</title>
    </head>
    <body>
        <nav>
            <div class="nav-links">
                <a href="index.html" class="pagelink"><i class="fa-solid fa-calendar-days"></i> Timetable generator</a>
            </div>
            <div class="nav-links">
                <a href="cueGenerator.html" class="pagelink"><i class="fa-solid fa-book"></i> (NEW) Flashcard Generator</a>
            </div>
        </nav>

        <form id="flashcardForm" onsubmit="event.preventDefault(); createFlashcard();">
            <h1>Flashcard Generator</h1>
            <table>
                <tr><th>Question</th><th>Answer</th></tr>
                <tr class="card-row"><td><input type="text"></td><td><input type="text"></td></tr>
                <tr class="card-row"><td><input type="text"></td><td><input type="text"></td></tr>
                <tr class="card-row"><td><input type="text"></td><td><input type="text"></td></tr>
                <tr class="card-row"><td><input type="text"></td><td><input type="text"></td></tr>
                <tr class="card-row"><td><input type="text"></td><td><input type="text"></td></tr>
            </table>
            <button type="submit">Generate & Print Flashcards</button>
        </form>

    </body>
        <script>
        function createFlashcard() {
            var rows = document.querySelectorAll('#flashcardForm .card-row');
            var tableBodyHtml = '';

            rows.forEach(function(row) {
                var inputs = row.querySelectorAll('input[type="text"]');
                var questionText = inputs[0].value.trim();
                var answerText = inputs[1].value.trim();

                if (questionText !== '' || answerText !== '') {
                    tableBodyHtml += `
                        <tr>
                            <td>${questionText}</td>
                            <td>${answerText}</td>
                        </tr>
                    `;
                }
            });

            if (tableBodyHtml === '') {
                tableBodyHtml = '<tr><td colspan="2">No flashcards to print. Please fill out the form.</td></tr>';
            }

            // Remove any pre-existing print iframe to prevent duplication
            var oldFrame = document.getElementById('printFrame');
            if (oldFrame) {
                oldFrame.parentNode.removeChild(oldFrame);
            }

            // Create a completely hidden iframe
            var iframe = document.createElement('iframe');
            iframe.id = 'printFrame';
            iframe.style.position = 'fixed';
            iframe.style.right = '0';
            iframe.style.bottom = '0';
            iframe.style.width = '0';
            iframe.style.height = '0';
            iframe.style.border = '0';
            
            document.body.appendChild(iframe);

            var htmlContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Print Flashcards</title>
                    <style>
    /* Forces the printer layout to A4 size and strips system margins */
    @page {
        size: A4;
        margin: 0;
    }
    body {
        font-family: Arial, sans-serif;
        margin: 20px; /* Optional visual buffer for the text inside the page border */
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    td {
        height: 180px;
        width: 50%;
        text-align: center;
        vertical-align: middle;
        padding: 10px;
        box-sizing: border-box;
    }
    /* Targets the first column to add a solid, dark right border */
    td:first-child {
        border-right: 2px solid #000000;
    }
</style>
                </head>
                <body>
                    <table>
                        ${tableBodyHtml}
                    </table>
                </body>
                </html>
            `;

            // Write content directly into the hidden iframe's document context
            var doc = iframe.contentWindow.document;
            doc.open();
            doc.write(htmlContent);
            doc.close();

            // Focus the frame and fire the print dialogue directly on the current tab
            iframe.contentWindow.focus();
            iframe.contentWindow.print();
        }
    </script>

</html>
